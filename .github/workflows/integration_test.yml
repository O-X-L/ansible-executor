---

name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/integration_test.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/integration_test.yml'

jobs:
  test:
    strategy:
      matrix:
        include:
          # see: https://docs.ansible.com/projects/ansible/latest/reference_appendices/release_and_maintenance.html#ansible-core-support-matrix
          - ansible_core_version: '2.18'
          - ansible_core_version: '2.19'
          - ansible_core_version: '2.20'

    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install -r requirements_build.txt >/dev/null
          sudo apt install python3-virtualenv python3-pip

      - name: Preparing test-env
        run: |
          echo 'CREATING TMP VENV'
          tmp_venv="$AR_VENV"
          python3 -m virtualenv "$tmp_venv" >/dev/null
          source "${tmp_venv}/bin/activate"

          echo 'INSTALLING DEPENDENCIES'
          pip install ansible-core==${{ matrix.ansible_core_version }}.*

          echo 'INSTALLING MODULE'
          python3 -m pip install -e "$GITHUB_WORKSPACE" >/dev/null
        env:
          AR_VENV: '/tmp/ar_venv'

      - name: Running Integration Tests
        run: |
          python3 ${GITHUB_WORKSPACE}/test/integration.py
        env:
          PYTHONUNBUFFERED: 1
          AR_TEST: 1
