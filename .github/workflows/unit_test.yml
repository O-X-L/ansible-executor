---

name: Unit-Tests

on:
  workflow_dispatch:
  push:
    branches: [latest]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements_unit_test.txt'
      - '.github/workflows/unit_test.yml'

  pull_request:
    branches: [latest]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements_unit_test.txt'
      - '.github/workflows/unit_test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt >/dev/null
          pip install -r requirements_unit_test.txt >/dev/null

      - name: Running Unit Tests
        run: |
          pytest --version
          python3 -m pytest
        env:
          PYTHONUNBUFFERED: 1
