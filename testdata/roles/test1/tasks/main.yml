---

- name: TEST 1 | Basic
  ansible.builtin.debug:
    msg: "TEST 1: '{{ test1_var1 }}'"
  when: test == 'test1'

- name: TEST 2 | Checking environmental variable
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'TEST2_VAR') == 'SomeRandomValue'
  when: test == 'test2'

- name: TEST 2 | Showing environmental variable
  ansible.builtin.debug:
    msg: "ENV VAR: {{ lookup('ansible.builtin.env', 'TEST2_VAR') }}"
  when: test == 'test2'

- name: TEST 3 | Sleeping
  ansible.builtin.pause:
    seconds: 60
  when: test == 'test3'

- name: TEST 4 | Fail
  ansible.builtin.fail:
    msg: 'Just failing'
  when: test == 'test4'

- name: TEST 5 | Vault Secret
  ansible.builtin.debug:
    msg: "TEST VAULT: '{{ this_vault }}'"
  vars:
    this_vault: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      30636534653737633039633933323964363762306366636638313365343865393761383162656330
      6437313832343833363238333266343363386435626334660a656239323163313233383734666562
      32333037306232326438613863363034363835613032643363386138613661373936386132343732
      6561396330383130360a666633356365643837393931363930626362366130613838646634393931
      3965
  when: test == 'test5'
